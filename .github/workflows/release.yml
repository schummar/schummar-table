name: Release
on:
  push:
    branches:
      - master
      - next

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp exec playwright install --with-deps chromium
      - run: vp test
      - run: vp pack

      - name: Setup git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email ""

      # `next` publishes prereleases (0.52.0-beta.0, -beta.1, ...) under the npm dist-tag `next`.
      # Stable releases ignore the beta tags when resolving the current version (strictPreid).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TAG: ${{ github.ref_name == 'next' && 'next' || 'latest' }}
          PREID: ${{ github.ref_name == 'next' && 'beta' || '' }}
        run: vp env exec pnpm nx release -y --preid "$PREID"

name: Lint
on:
  pull_request:
    branches:
      - master
      - next
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true

      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp exec playwright install --with-deps chromium
      - run: vp test
      - run: vp pack
